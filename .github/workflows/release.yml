name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.8.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Linux C-backend compiler
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-cargo-

      - name: Test
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --lib
          cargo test --tests

      - name: Build Release Binary
        run: cargo build --release

      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp target/release/zen dist/
          chmod +x dist/zen
          cd dist && tar -czvf ../zen-linux-x86_64.tar.gz zen

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-linux-x86_64
          path: zen-linux-x86_64.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Zen ${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
