[package]
name = "zen"
version = "0.8.0"
edition = "2021"

[dependencies]
ariadne = "0.4.1"
colored = "2.0"
rustyline = "14.0"
glob = "0.3"
libc = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[lib]
name = "zen"
path = "src/lib.rs"

[[bin]]
name = "zen"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
incremental = false

[profile.dev]
codegen-units = 16
incremental = true
